<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SABER Player</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .msg { color: #fff; font-family: sans-serif; font-size: 14px; text-align: center; padding-top: 40vh; }
</style>
</head>
<body>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get('id') || '';
    if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) {
      document.body.innerHTML = '<div class="msg">رابط فيديو غير صالح</div>';
      return;
    }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?playsinline=1&rel=0&autoplay=0';
    f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    f.setAttribute('allowfullscreen', 'true');
    f.setAttribute('frameborder', '0');
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
